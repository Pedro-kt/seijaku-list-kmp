query GetSectionMedia(
    $page: Int,
    $perPage: Int,
    $type: MediaType,
    $status: MediaStatus,
    $sort: [MediaSort],
    $format: MediaFormat,
    $countryOfOrigin: CountryCode,
    $isAdult: Boolean
) {
    Page(page: $page, perPage: $perPage) {
        pageInfo {
            total
            currentPage
            lastPage
            hasNextPage
            perPage
        }
        media(
            type: $type,
            status: $status,
            sort: $sort,
            format: $format,
            countryOfOrigin: $countryOfOrigin,
            isAdult: $isAdult
        ) {
            id
            title {
                romaji
                english
                native
            }
            coverImage {
                extraLarge
                large
                medium
                color
            }
            averageScore
            format
            episodes
            chapters
            genres
            isAdult
        }
    }
}
