query GetTrendingAnime($page: Int, $perPage: Int, $isAdult: Boolean) {
    Page(page: $page, perPage: $perPage) {
        media(type: ANIME, sort: TRENDING_DESC, isAdult: $isAdult) {
            id
            title {
                romaji
                english
                native
            }
            isAdult
        }
    }
}
