query GetTopRatedManga($page: Int, $perPage: Int, $isAdult: Boolean) {
    Page(page: $page, perPage: $perPage) {
        media(type: MANGA, sort: SCORE_DESC, isAdult: $isAdult) {
            id
            title {
                romaji
                english
                native
            }
            coverImage {
                extraLarge
                large
                medium
                color
            }
            averageScore
            format
            status
            chapters
            volumes
            genres
            isAdult
        }
    }
}
